name: Deploy

# Deploys to the ryanweiss.net box (162.35.181.92) on push to main or manual run.
# The server pulls origin/main and builds itself via scripts/update.sh.
#
# Optional repo secret:
#   SSH_PRIVATE_KEY — a key authorized for rw3iss@162.35.181.92.
#   Without it this job is a no-op (deploy manually with scripts/deploy.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo-manager
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: 162.35.181.92
      SSH_USER: rw3iss
      HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Skip (no SSH_PRIVATE_KEY secret)
        if: env.HAS_KEY != 'true'
        run: echo "SSH_PRIVATE_KEY not set — skipping. Deploy with scripts/deploy.sh."

      - name: Deploy over SSH
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "bash /var/www/demo-manager/scripts/update.sh"
