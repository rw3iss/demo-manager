# demos.ryanweiss.net — reverse-proxy → systemd demo-manager on host :8092.
# Managed in the demo-manager repo at deploy/nginx/demos.ryanweiss.net.conf.
# Install: copy to /opt/ven-cms/nginx/conf.d/ then `docker exec ven-nginx nginx -s reload`.
#
# ONE vhost fronts the whole product: the app serves /manage (admin SPA),
# /api (admin API), and /<slug>/... (the demos). Adding a project needs NO
# nginx change.

server {
    listen 80;
    server_name demos.ryanweiss.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demos.ryanweiss.net;

    ssl_certificate     /etc/nginx/ssl/demos-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/demos-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Zip uploads pass through nginx → keep the body cap high and timeouts
    # generous. Must be >= the app's MAX_UPLOAD_MB.
    client_max_body_size 300M;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 172.20.0.1 is the docker bridge gateway for the `ven-internal` network —
    # the host as seen from inside the ven-nginx container. demo-manager binds
    # 0.0.0.0:8092 on the host.
    location / {
        proxy_pass http://172.20.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
