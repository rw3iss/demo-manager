# demos.ryanweiss.net — reverse proxy → systemd demo-manager on 127.0.0.1:4090.
# Installed to /etc/nginx/conf.d/demos.ryanweiss.net.conf by scripts/setup-server.sh.
#
# ONE vhost fronts the whole product: the app serves /manage (admin SPA),
# /api (admin API), and /<slug>/... (the demos). Adding a project needs NO
# nginx change.

upstream demo_manager_backend { server 127.0.0.1:4090; keepalive 16; }

server {
    listen 80; listen [::]:80;
    server_name demos.ryanweiss.net;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name demos.ryanweiss.net;

    ssl_certificate     /etc/letsencrypt/live/demos.ryanweiss.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demos.ryanweiss.net/privkey.pem;
    ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Zip uploads pass through nginx: keep the cap >= the app's MAX_UPLOAD_MB.
    client_max_body_size 300M;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / { proxy_pass http://demo_manager_backend; }
}
